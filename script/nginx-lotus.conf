server {
    listen 80;
    server_name academy.ssbx.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name academy.ssbx.site;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/academy.ssbx.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.ssbx.site/privkey.pem;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 50m;

    # 2026-11-09 加固：books 桶已改私有桶（public 桶会让 storage-api 以超级用户读、绕过 RLS）。
    # 封面的旧 public 地址（含库里存的 cover_url）转到普通读取接口，带 anon key，按 RLS 放行 covers/
    location ^~ /api/storage/v1/object/public/books/covers/ {
        proxy_pass http://127.0.0.1:8003/storage/v1/object/books/covers/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header apikey "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzA0MDY3MjAwLCJleHAiOjE4OTM0NTYwMDB9.kd1P2OnZ1ivQBi9JBNu1RRM54exg0Q4zSeiaj6KjleM";
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzA0MDY3MjAwLCJleHAiOjE4OTM0NTYwMDB9.kd1P2OnZ1ivQBi9JBNu1RRM54exg0Q4zSeiaj6KjleM";
        expires 7d;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 2026-11-09 加固：books 桶是 public 桶，/object/public/ 绕过存储 RLS。
    # 只放行封面，书文件一律走带登录态的 /object/books/...
    location ~ ^/api/storage/v1/(object|render/image)/public/books/(?!covers/) {
        return 403;
    }

    # Supabase Storage — PDF 缓存
    location ~* ^/api/(storage/v1/object/.+\.pdf)$ {
        proxy_pass http://127.0.0.1:8003/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control;
        expires 1d;
        add_header Cache-Control "private, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 2026-11-09 加固：其余存储响应（头像等）同样禁止脚本执行
    location ~ ^/api/(storage/.*)$ {
        proxy_pass http://127.0.0.1:8003/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Supabase API (Kong)
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    location / {
        root /opt/lotus-academy/frontend;
        try_files $uri $uri.html $uri/ /index.html;

        # HTML 不缓存，每次检查更新
        add_header Cache-Control "no-cache" always;

        # 静态资源缓存（Next.js 带 hash 的文件）
        location ~* \.(js|css|mjs|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
