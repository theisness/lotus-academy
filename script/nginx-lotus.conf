server {
    listen 80;
    server_name academy.ssbx.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name academy.ssbx.site;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/academy.ssbx.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.ssbx.site/privkey.pem;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 50m;

    # Supabase Storage — PDF 缓存
    location ~* ^/api/(storage/v1/object/.+\.pdf)$ {
        proxy_pass http://127.0.0.1:8003/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Supabase API (Kong)
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    location / {
        root /opt/lotus-academy/frontend;
        try_files $uri $uri.html $uri/ /index.html;

        # HTML 不缓存，每次检查更新
        add_header Cache-Control "no-cache" always;

        # 静态资源缓存（Next.js 带 hash 的文件）
        location ~* \.(js|css|mjs|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
